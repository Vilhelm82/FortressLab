[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "fortresslab"
version = "0.1.0"
description = "Headless, evidence-backed fortification evaluation research environment"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.13.4,<3",
]

[project.scripts]
fortresslab = "fortresslab.cli:entrypoint"

[dependency-groups]
dev = [
  "hypothesis>=6.165.9,<7",
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fortresslab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
